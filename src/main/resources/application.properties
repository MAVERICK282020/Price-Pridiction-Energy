spring.application.name=smart-energy-monitoring-system
server.port=8080

# Default profile uses H2 so the project runs immediately.
# To use MySQL: run with --spring.profiles.active=mysql and update application-mysql.properties.
spring.datasource.url=jdbc:h2:mem:energydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Anomaly threshold: usage 40% above recent average is abnormal.
energy.anomaly.multiplier=1.40
energy.prediction.window=7

# Optional MQTT settings. Enable by setting mqtt.enabled=true.
mqtt.enabled=false
mqtt.broker=tcp://broker.hivemq.com:1883
mqtt.topic=smart-energy/readings
mqtt.clientId=smart-energy-java-client
